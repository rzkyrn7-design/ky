name: Render Video

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Render Video
        run: npx remotion render HelloWorld out/video.mp4

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: video-hasil-render
          path: out/video.mp4
          
